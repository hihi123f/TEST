<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>건초 더미에서 바늘 찾기</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      border: 2px solid #555;
      cursor: crosshair;
      background: #222;
    }
    #status {
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>🌾 건초 더미를 드래그해 바늘을 찾으세요!</h2>
  <canvas id="haystack" width="600" height="400"></canvas>
  <div id="status">남은 건초를 치우는 중...</div>

  <script>
    const canvas = document.getElementById('haystack');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    // 1. 숨겨진 바늘 좌표 (랜덤)
    const needle = {
      x: Math.floor(Math.random() * (canvas.width - 40)) + 20,
      y: Math.floor(Math.random() * (canvas.height - 40)) + 20,
      size: 4
    };

    // 2. 건초 질감 채우기 (무작위 선 15,000개로 빽빽하게 덮기)
    function drawHaystack() {
      for (let i = 0; i < 15000; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const length = Math.random() * 20 + 5;
        const angle = Math.random() * Math.PI;

        ctx.strokeStyle = `hsl(${Math.random() * 15 + 40}, 80%, ${Math.random() * 30 + 35}%)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
        ctx.stroke();
      }
    }

    drawHaystack();

    // 3. 삽(마우스 드래그)으로 건초 치우기
    let isDigging = false;
    const digRadius = 20;

    function dig(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 마우스 영역 건초 지우기 (투명하게 뚫기)
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, digRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 바늘 발견 판정
      const dist = Math.hypot(x - needle.x, y - needle.y);
      if (dist < digRadius) {
        // 발견 시 바늘 그리기
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(needle.x - 5, needle.y - 10);
        ctx.lineTo(needle.x + 5, needle.y + 10);
        ctx.stroke();
        ctx.restore();

        statusText.innerHTML = "🎉 <b>바늘을 찾았습니다!</b>";
        canvas.onmousemove = null;
      }
    }

    canvas.addEventListener('mousedown', (e) => { isDigging = true; dig(e); });
    window.addEventListener('mouseup', () => isDigging = false);
    canvas.addEventListener('mousemove', (e) => { if (isDigging) dig(e); });
  </script>
</body>
</html>
