<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>500만 개... 까진 아니지만 건초 뽑기 게임</title>
  <style>
    body {
      margin: 0;
      background: #11100f;
      color: #dcd7cd;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #ui {
      margin-bottom: 15px;
      text-align: center;
    }
    h2 { margin: 0 0 5px 0; color: #f1c40f; font-size: 20px; }
    p { margin: 0; font-size: 14px; color: #888; }
    canvas {
      border: 3px solid #332b22;
      background: #1c1712;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h2>🌾 건초 더미에서 바늘 찾기 (The Haystack)</h2>
    <p id="status-msg">마우스 클릭으로 건초 조각을 하나씩 뽑아내세요! (남은 건초: <span id="count">0</span>개)</p>
  </div>

  <canvas id="gameCanvas" width="700" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('count');
    const statusMsg = document.getElementById('status-msg');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    // 건초 더미 데이터 (빽빽하게 깔린 선 배열)
    let hays = [];
    let needle = { x: 0, y: 0, found: false };

    function initGame() {
      hays = [];
      needle.found = false;
      
      // 바늘 위치 랜덤 선정 (화면 중앙 부근)
      needle.x = WIDTH / 2 + (Math.random() - 0.5) * 200;
      needle.y = HEIGHT / 2 + (Math.random() - 0.5) * 200;

      // 빽빽한 건초 생성 (약 2,500개 - 웹에서 부드럽게 돌아가는 최대치)
      for (let i = 0; i < 2500; i++) {
        hays.push({
          x: WIDTH / 2 + (Math.random() - 0.5) * 350,
          y: HEIGHT / 2 + (Math.random() - 0.5) * 350,
          length: Math.random() * 25 + 15,
          angle: Math.random() * Math.PI,
          color: `hsl(${38 + Math.random() * 12}, 70%, ${30 + Math.random() * 30}%)`
        });
      }
      updateCount();
    }

    function updateCount() {
      countDisplay.innerText = hays.length;
    }

    // 화면 그리기
    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // 1. 가장 밑바닥에 숨겨진 바늘 그리기 (건초가 다 치워져야 보임)
      if (!needle.found) {
        ctx.save();
        ctx.translate(needle.x, needle.y);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(15, 0);
        ctx.stroke();
        ctx.restore();
      }

      // 2. 건초 더미 렌더링 (위에서부터 차곡차곡 쌓인 느낌)
      hays.forEach(hay => {
        ctx.strokeStyle = hay.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        const cos = Math.cos(hay.angle) * (hay.length / 2);
        const sin = Math.sin(hay.angle) * (hay.length / 2);
        ctx.moveTo(hay.x - cos, hay.y - sin);
        ctx.lineTo(hay.x + cos, hay.y + sin);
        ctx.stroke();
      });

      // 만약 바늘을 찾았을 때
      if (needle.found) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#00ffff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("🎉 바늘을 찾아냈습니다!", WIDTH / 2, HEIGHT / 2 - 10);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText("당신의 극악무도한 인내심에 경배를 표합니다.", WIDTH / 2, HEIGHT / 2 + 30);
      }
    }

    // 마우스 클릭 시 해당 위치의 건초들을 뽑아냄 (제거)
    canvas.addEventListener('click', (e) => {
      if (needle.found) return;

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const pickRadius = 35; // 한 번에 파내는 반경

      // 클릭한 위치 주변의 건초들을 대거 제거 (건초 뽑기)
      hays = hays.filter(hay => {
        const dist = Math.hypot(hay.x - mouseX, hay.y - mouseY);
        return dist > pickRadius; // 클릭 범위 안에 있는 건초 삭제
      });

      updateCount();

      // 바늘 위치가 건초에 의해 안 가려져 있는지(주변 건초가 다 치워졌는지) 확인
      const distToNeedle = Math.hypot(mouseX - needle.x, mouseY - needle.y);
      if (distToNeedle < 30) {
        // 바늘 주변 건초가 충분히 제거되었는지 검사
        const remainingNearNeedle = hays.filter(h => Math.hypot(h.x - needle.x, h.y - needle.y) < 15).length;
        if (remainingNearNeedle < 3) {
          needle.found = true;
        }
      }

      draw();
    });

    // 최초 실행
    initGame();
    draw();
  </script>
</body>
</html>
