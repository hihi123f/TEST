<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리의 보물지도 일기 🗺️✨</title>
  
  <!-- 구글 폰트 (Jua 둥글둥글체) -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <!-- Leaflet 지도 스타일 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Jua', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; background: #fff5f7; color: #4a4a4a; overflow: hidden; position: fixed; }

    .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }

    /* 🎀 상단 헤더 */
    header { background: #ffffff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #ffccd5; z-index: 1000; box-shadow: 0 4px 12px rgba(255, 182, 193, 0.15); }
    .logo-area { display: flex; align-items: center; gap: 6px; font-size: 1.1rem; color: #ff6b8b; }
    .room-badge { background: #ffe3e8; color: #ff477e; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; border: 1px solid #ffb3c1; }
    .user-select { background: #fff0f3; color: #d6336c; border: 2px solid #ffb3c1; padding: 6px 10px; border-radius: 14px; font-size: 0.85rem; outline: none; }

    /* 🗺️ 지도 영역 */
    #map { flex: 1; width: 100%; z-index: 1; }

    /* 📖 하단 일기 타임라인 */
    .timeline-container { background: #ffffff; padding: 10px 12px; border-top: 2px dashed #ffccd5; display: flex; flex-direction: column; gap: 6px; z-index: 1000; }
    .timeline-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; padding: 0 2px; }
    .timeline-track { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-behavior: smooth; }
    .timeline-track::-webkit-scrollbar { display: none; }
    
    .timeline-card { flex: 0 0 85px; background: #fff0f3; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid #ffb3c1; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .timeline-card.active { border-color: #ff477e; transform: scale(0.95); background: #ffe3e8; }
    .timeline-card video { width: 100%; height: 50px; object-fit: cover; pointer-events: none; }
    .timeline-card-meta { padding: 4px 6px; font-size: 0.65rem; display: flex; justify-content: space-between; align-items: center; color: #555; }
    .user-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

    /* 📸 하단 촬영 바 */
    .action-bar { background: #ffffff; padding: 12px 16px; display: flex; gap: 10px; align-items: center; border-top: 2px solid #ffe3e8; z-index: 1000; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    video#preview { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #ff6b8b; background: #000; }
    button#recordBtn { flex: 1; padding: 14px; background: linear-gradient(135deg, #ff6b8b, #ff8fa3); color: #fff; border: none; border-radius: 20px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 107, 139, 0.3); }
    button#recordBtn:active { transform: scale(0.97); }
    button#recordBtn:disabled { background: #e0e0e0; box-shadow: none; color: #999; }

    /* 💌 감성 그림일기 카드 팝업 모달 */
    .leaflet-popup-content-wrapper { background: #fffdf9; color: #4a4a4a; border-radius: 20px; border: 3px solid #ffb3c1; box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4); padding: 5px; }
    .leaflet-popup-tip { background: #fffdf9; }
    .diary-card { display: flex; flex-direction: column; gap: 6px; width: 180px; padding: 4px; }
    .diary-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: #ff6b8b; font-weight: bold; }
    .diary-video { width: 100%; height: 100px; border-radius: 12px; object-fit: cover; border: 2px solid #ffe3e8; }
    .diary-content { background: #fff5f7; padding: 6px 8px; border-radius: 10px; font-size: 0.8rem; text-align: center; border: 1px dashed #ffb3c1; color: #555; }
    .diary-sticker { font-size: 1rem; text-align: center; }

    /* 일기 작성 모달창 */
    #diaryModal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #fffdf9; width: 100%; max-width: 320px; border-radius: 24px; border: 3px solid #ff6b8b; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal-content h3 { color: #ff6b8b; font-size: 1.1rem; text-align: center; }
    .modal-content textarea { width: 100%; height: 70px; border: 2px solid #ffb3c1; border-radius: 12px; padding: 8px; font-size: 0.9rem; resize: none; outline: none; background: #fff5f7; }
    .sticker-picker { display: flex; justify-content: space-around; font-size: 1.4rem; cursor: pointer; }
    .modal-btn { background: #ff6b8b; color: white; border: none; padding: 10px; border-radius: 14px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 헤더 -->
  <header>
    <div class="logo-area">
      <span>🐾 우리들의 보물지도</span>
      <span class="room-badge">#우리방</span>
    </div>
    <select id="userPicker" class="user-select">
      <option value="채원" data-color="#ff6b8b">🎀 채원 (나)</option>
      <option value="민서" data-color="#4ecd75">🌱 민서</option>
      <option value="도윤" data-color="#339af0">⭐ 도윤</option>
    </select>
  </header>

  <!-- 지도 영역 -->
  <div id="map"></div>

  <!-- 타임라인 바 -->
  <div class="timeline-container">
    <div class="timeline-info">
      <span>오늘의 그림일기 스팟 (<span id="totalClips">0</span>)</span>
      <span>✨ 탭하면 지도 이동</span>
    </div>
    <div class="timeline-track" id="timelineTrack"></div>
  </div>

  <!-- 촬영 컨트롤 -->
  <div class="action-bar">
    <video id="preview" autoplay playsinline muted></video>
    <button id="recordBtn" disabled>💌 2초 순간 & 일기 남기기</button>
  </div>
</div>

<!-- 일기 작성 팝업 모달 -->
<div id="diaryModal">
  <div class="modal-content">
    <h3>📖 오늘의 그림일기 쓰기</h3>
    <div style="text-align: center; font-size: 0.8rem; color: #888;" id="modalLocationText">📍 위치 확인 중...</div>
    <div class="sticker-picker">
      <span onclick="selectSticker('🌸')">🌸</span>
      <span onclick="selectSticker('⭐')">⭐</span>
      <span onclick="selectSticker('☕')">☕</span>
      <span onclick="selectSticker('🔥')">🔥</span>
      <span onclick="selectSticker('🍀')">🍀</span>
    </div>
    <textarea id="diaryInput" placeholder="이 장소에서 있었던 일을 한 줄로 적어보세요! (예: 여기서 엄청 맛있는 커피 마심 ☕)"></textarea>
    <button class="modal-btn" id="saveDiaryBtn">일기장에 꾹 저장하기 📌</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let map;
  let mediaStream = null;
  let spots = [];
  let currentTempData = null; // 촬영 직후 임시 저장 데이터
  let selectedEmoji = '🌸';

  const userColors = { '채원': '#ff6b8b', '민서': '#4ecd75', '도윤': '#339af0' };
  const userLines = {};

  const recordBtn = document.getElementById('recordBtn');
  const preview = document.getElementById('preview');
  const timelineTrack = document.getElementById('timelineTrack');
  const totalClips = document.getElementById('totalClips');
  const userPicker = document.getElementById('userPicker');
  const diaryModal = document.getElementById('diaryModal');
  const diaryInput = document.getElementById('diaryInput');
  const modalLocationText = document.getElementById('modalLocationText');
  const saveDiaryBtn = document.getElementById('saveDiaryBtn');

  function initMap(lat, lon) {
    map = L.map('map', { zoomControl: false }).setView([lat, lon], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    Object.keys(userColors).forEach(user => {
      userLines[user] = L.polyline([], { color: userColors[user], weight: 4, opacity: 0.7, dashArray: '5, 8' }).addTo(map);
    });
  }

  async function init() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
      preview.srcObject = mediaStream;

      navigator.geolocation.getCurrentPosition(
        (pos) => { initMap(pos.coords.latitude, pos.coords.longitude); recordBtn.disabled = false; },
        () => { initMap(37.5665, 126.9780); recordBtn.disabled = false; },
        { enableHighAccuracy: true }
      );
    } catch(e) {
      alert("카메라 및 위치(GPS) 권한을 허용해주세요!");
    }
  }

  // 1단계: 2초 촬영 시작
  recordBtn.addEventListener('click', () => {
    recordBtn.disabled = true;
    recordBtn.innerText = "✨ 2초 순간 기록 중...";

    navigator.geolocation.getCurrentPosition((pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const currentUser = userPicker.value;

      const mediaRecorder = new MediaRecorder(mediaStream);
      const chunks = [];
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      
      mediaRecorder.onstop = () => {
        const videoUrl = URL.createObjectURL(new Blob(chunks, { type: 'video/mp4' }));
        
        // 임시 저장 후 일기 작성 모달 띄우기
        currentTempData = { user: currentUser, lat, lon, time, videoUrl };
        modalLocationText.innerText = `📍 위치 수신 완료 (${time})`;
        diaryModal.style.display = 'flex';

        recordBtn.disabled = false;
        recordBtn.innerText = "💌 2초 순간 & 일기 남기기";
      };

      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), 2000);
    }, () => {
      alert("GPS 위치를 찾지 못했어요.");
      recordBtn.disabled = false;
      recordBtn.innerText = "💌 2초 순간 & 일기 남기기";
    }, { enableHighAccuracy: true });
  });

  function selectSticker(emoji) {
    selectedEmoji = emoji;
  }

  // 2단계: 일기 내용 입력 후 지도에 최종 등록
  saveDiaryBtn.addEventListener('click', () => {
    const text = diaryInput.value.trim() || "오늘의 소중한 순간 🐾";
    if (!currentTempData) return;

    addRecord(currentTempData.user, currentTempData.lat, currentTempData.lon, currentTempData.time, currentTempData.videoUrl, text, selectedEmoji);
    
    diaryInput.value = "";
    diaryModal.style.display = 'none';
  });

  // 지도 마커 및 그림일기 카드 등록
  function addRecord(user, lat, lon, time, videoUrl, text, sticker) {
    const color = userColors[user];
    userLines[user].addLatLng([lat, lon]);

    const marker = L.circleMarker([lat, lon], {
      radius: 10,
      fillColor: color,
      color: '#ffffff',
      weight: 3,
      fillOpacity: 1
    }).addTo(map);

    const popupHtml = `
      <div class="diary-card">
        <div class="diary-header">
          <span>${sticker} ${user}의 일기</span>
          <span>${time}</span>
        </div>
        <video class="diary-video" src="${videoUrl}" autoplay loop muted playsinline></video>
        <div class="diary-content">${text}</div>
      </div>
    `;
    marker.bindPopup(popupHtml);

    const spotData = { id: Date.now(), user, time, lat, lon, videoUrl, text, sticker, marker };
    spots.push(spotData);

    renderTimelineCard(spotData);
    map.flyTo([lat, lon], 17);
    marker.openPopup();
    totalClips.innerText = spots.length;
  }

  function renderTimelineCard(spot) {
    const card = document.createElement('div');
    card.className = 'timeline-card';
    card.innerHTML = `
      <video src="${spot.videoUrl}" muted playsinline></video>
      <div class="timeline-card-meta">
        <span><span class="user-dot" style="background:${userColors[spot.user]}"></span>${spot.user}</span>
        <span>${spot.sticker}</span>
      </div>
    `;

    card.addEventListener('click', () => {
      document.querySelectorAll('.timeline-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      map.flyTo([spot.lat, spot.lon], 17);
      spot.marker.openPopup();
    });

    timelineTrack.appendChild(card);
    timelineTrack.scrollLeft = timelineTrack.scrollWidth;
  }

  init();
</script>
</body>
</html>
