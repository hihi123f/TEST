<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D 건초 큐브 바늘 찾기</title>
  <!-- 3D 렌더링 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0e0c0a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-container { width: 100%; height: 100%; display: block; }
    
    #header-ui {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 0; width: 100%;
      display: flex; justify-content: center;
      pointer-events: none; z-index: 10;
    }
    .status-card {
      background: rgba(18, 15, 12, 0.85);
      border: 1px solid #4a3f35;
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .status-card .count { font-size: 15px; font-weight: 800; color: #f5c563; }
    .status-card .sub { font-size: 11px; color: #aaa; margin-top: 2px; }

    #bottom-ui {
      position: absolute;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 0; width: 100%;
      display: flex; justify-content: center;
      gap: 6px; padding: 0 10px; z-index: 10;
    }
    .tool-btn {
      flex: 1; max-width: 90px; height: 54px;
      background: rgba(28, 22, 16, 0.9);
      border: 1.5px solid #4e4033;
      color: #cfc6b8; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .tool-btn .name { font-size: 12px; font-weight: 700; }
    .tool-btn .req { font-size: 9px; color: #888; }
    .tool-btn.locked { opacity: 0.35; cursor: not-allowed; }
    .tool-btn.active {
      background: linear-gradient(135deg, #d4a343, #b88628);
      color: #120e06; border-color: #ffe082;
      box-shadow: 0 0 14px rgba(212, 163, 67, 0.6);
    }
    .tool-btn.active .req { color: #2b1f07; font-weight: 600; }

    #toast {
      position: absolute; top: 18%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(20, 16, 12, 0.95);
      border: 2px solid #f5c563;
      padding: 10px 20px; border-radius: 16px;
      color: #fff; font-weight: bold; font-size: 14px;
      z-index: 50; opacity: 0; pointer-events: none; transition: all 0.3s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    #win-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 9, 7, 0.9); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s;
    }
    #win-modal.show { opacity: 1; pointer-events: auto; }
    .win-card {
      background: #1e1913; border: 2px solid #00f0ff;
      border-radius: 20px; padding: 28px 20px; text-align: center;
      max-width: 300px; width: 90%;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
    }
    .win-card button {
      margin-top: 18px; width: 100%; height: 44px;
      background: #00f0ff; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer; color: #111;
    }
  </style>
</head>
<body>

  <div id="header-ui">
    <div class="status-card">
      <div class="count">남은 건초: <span id="hay-left">1,000,000</span>개</div>
      <div class="sub">화면 드래그로 회전 | 탭하여 블록 파내기</div>
    </div>
  </div>

  <div id="webgl-container"></div>
  <div id="toast">🎉 새 장비 해금!</div>

  <div id="bottom-ui">
    <button class="tool-btn active" id="btn-tweezer" onclick="setTool('tweezer')">
      <span class="name">🤏 핀셋</span>
      <span class="req">기본 (1블록)</span>
    </button>
    <button class="tool-btn locked" id="btn-earpick" onclick="setTool('earpick')">
      <span class="name">✨ 귀이개</span>
      <span class="req">1만 개</span>
    </button>
    <button class="tool-btn locked" id="btn-spoon" onclick="setTool('spoon')">
      <span class="name">🥄 숟가락</span>
      <span class="req">10만 개</span>
    </button>
    <button class="tool-btn locked" id="btn-blower" onclick="setTool('blower')">
      <span class="name">💨 송풍기</span>
      <span class="req">50만 개</span>
    </button>
  </div>

  <div id="win-modal">
    <div class="win-card">
      <h2 style="color:#00f0ff; margin-bottom:8px;">🎉 바늘 발굴 완료!</h2>
      <p style="color:#ccc; font-size:13px; line-height:1.4;">
        3D 건초 큐브의 내부를 파헤쳐 중앙에 숨겨진 은바늘을 획득했습니다!
      </p>
      <button onclick="initGame()">새 큐브 도전</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('webgl-container');
    const hayLeftEl = document.getElementById('hay-left');
    const toast = document.getElementById('toast');
    const winModal = document.getElementById('win-modal');

    const TOTAL_START = 1000000;
    const GRID = 11; // 11x11x11 = 총 1,331개의 입체 블록으로 구성된 거대 큐브
    const BLOCK_SIZE = 0.8;
    const SPACING = 0.85;

    let scene, camera, renderer, controls;
    let blocks = [];
    let needleMesh;
    let totalHay = TOTAL_START;
    let clearedHay = 0;
    let currentTool = 'tweezer';
    let gameWon = false;

    // 도구 스펙 (해금치, 파괴 반경, 100만 스케일 감소 가중치)
    const TOOLS = {
      tweezer: { name: '핀셋', req: 0, unlocked: true, radius: 0, scaleRate: 1 },
      earpick: { name: '귀이개', req: 10000, unlocked: false, radius: 1, scaleRate: 8 },
      spoon:   { name: '숟가락', req: 100000, unlocked: false, radius: 2, scaleRate: 40 },
      blower:  { name: '송풍기', req: 500000, unlocked: false, radius: 4, scaleRate: 200 }
    };

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0e0c0a);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(12, 10, 15);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 25;
      controls.minDistance = 4;

      // 조명
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffd580, 1.0);
      dirLight.position.set(10, 15, 10);
      scene.add(dirLight);

      const blueLight = new THREE.PointLight(0x00f0ff, 1.5, 10);
      blueLight.position.set(0, 0, 0);
      scene.add(blueLight);
    }

    function initGame() {
      gameWon = false;
      winModal.classList.remove('show');
      totalHay = TOTAL_START;
      clearedHay = 0;
      updateUI();

      // 기존 블록 제거
      blocks.forEach(b => scene.remove(b.mesh));
      blocks = [];
      if (needleMesh) scene.remove(needleMesh);

      // 건초 블록 텍스처 머티리얼들
      const hayMats = [
        new THREE.MeshLambertMaterial({ color: 0xc8963e }),
        new THREE.MeshLambertMaterial({ color: 0xdfab43 }),
        new THREE.MeshLambertMaterial({ color: 0xa8782a }),
        new THREE.MeshLambertMaterial({ color: 0x8a601c })
      ];
      const boxGeo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

      const offset = (GRID - 1) * SPACING / 2;

      // 11x11x11 큐브 생성
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          for (let z = 0; z < GRID; z++) {
            // 정중앙 바늘 들어갈 자리는 비워둠
            if (x >= 4 && x <= 6 && y >= 4 && y <= 6 && z >= 4 && z <= 6) {
              continue;
            }

            const mat = hayMats[Math.floor(Math.random() * hayMats.length)];
            const mesh = new THREE.Mesh(boxGeo, mat);
            mesh.position.set(x * SPACING - offset, y * SPACING - offset, z * SPACING - offset);
            mesh.userData = { gridX: x, gridY: y, gridZ: z };
            scene.add(mesh);
            blocks.push({ mesh, x, y, z });
          }
        }
      }

      // 정중앙에 은바늘 생성 (메탈릭 실버)
      const needleGeo = new THREE.CylinderGeometry(0.06, 0.02, 2.8, 16);
      const needleMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        metalness: 0.95,
        roughness: 0.1,
        emissive: 0x00f0ff,
        emissiveIntensity: 0.3
      });
      needleMesh = new THREE.Mesh(needleGeo, needleMat);
      needleMesh.rotation.z = Math.PI / 4;
      needleMesh.rotation.x = Math.PI / 6;
      needleMesh.userData = { isNeedle: true };
      scene.add(needleMesh);

      // 툴 초기화
      Object.keys(TOOLS).forEach(k => {
        TOOLS[k].unlocked = TOOLS[k].req === 0;
        const btn = document.getElementById(`btn-${k}`);
        if (btn) btn.classList.toggle('locked', !TOOLS[k].unlocked);
      });
      setTool('tweezer');
    }

    function setTool(key) {
      if (!TOOLS[key].unlocked) return;
      currentTool = key;
      Object.keys(TOOLS).forEach(k => {
        const btn = document.getElementById(`btn-${k}`);
        if (btn) btn.classList.toggle('active', k === key);
      });
    }

    function updateUI() {
      hayLeftEl.innerText = totalHay.toLocaleString();
    }

    function showToast(name) {
      toast.innerText = `🔓 [${name}] 장비 해금!`;
      toast.classList.add('show');
      if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function checkUnlocks() {
      Object.keys(TOOLS).forEach(k => {
        if (!TOOLS[k].unlocked && clearedHay >= TOOLS[k].req) {
          TOOLS[k].unlocked = true;
          document.getElementById(`btn-${k}`).classList.remove('locked');
          showToast(TOOLS[k].name);
        }
      });
    }

    // 터치/클릭한 블록 파괴 로직
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let touchStartTime = 0;

    window.addEventListener('pointerdown', () => { touchStartTime = Date.now(); });

    window.addEventListener('pointerup', (e) => {
      // 250ms 이하의 탭(클릭) 동작만 채굴로 인식 (드래그 회전과 구분)
      if (Date.now() - touchStartTime > 250 || gameWon) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children);

      if (intersects.length > 0) {
        const hit = intersects[0].object;

        // 바늘 탭했을 때 클리어 판정
        if (hit.userData.isNeedle) {
          gameWon = true;
          if (navigator.vibrate) navigator.vibrate([150, 80, 200]);
          winModal.classList.add('show');
          return;
        }

        if (hit.userData.gridX !== undefined) {
          const target = hit.userData;
          const tool = TOOLS[currentTool];
          const rad = tool.radius;

          // 반경 내 블록들 제거
          const toRemove = [];
          blocks = blocks.filter(b => {
            const dx = Math.abs(b.x - target.gridX);
            const dy = Math.abs(b.y - target.gridY);
            const dz = Math.abs(b.z - target.gridZ);

            if (dx <= rad && dy <= rad && dz <= rad) {
              toRemove.push(b.mesh);
              return false;
            }
            return true;
          });

          toRemove.forEach(mesh => scene.remove(mesh));

          // 수치 차감 및 해금
          const removedCount = Math.max(1, toRemove.length) * (tool.scaleRate * 250);
          totalHay = Math.max(0, totalHay - removedCount);
          clearedHay += removedCount;
          updateUI();
          checkUnlocks();

          if (navigator.vibrate) navigator.vibrate(30);
        }
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // 바늘 회전 & 반짝임
      if (needleMesh) {
        needleMesh.rotation.y += 0.02;
      }

      renderer.render(scene, camera);
    }

    initThree();
    initGame();
    animate();
  </script>
</body>
</html>
