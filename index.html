<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리들의 부루마블 랜드 🎲👑</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    /* 이전과 동일한 아기자기한 보드판 디자인 */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Jua', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; background: #2b1055; color: #fff; overflow: hidden; position: fixed; }
    .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; background: radial-gradient(circle, #3a1c71 0%, #1d093b 100%); }

    header { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.15); z-index: 1000; }
    .logo-area { display: flex; align-items: center; gap: 6px; font-size: 1.1rem; color: #ffeb3b; }
    .user-select { background: #fff; color: #3a1c71; border: none; padding: 6px 12px; border-radius: 14px; font-size: 0.85rem; font-weight: bold; outline: none; }

    .board-container { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; position: relative; z-index: 1; }
    .board-center { grid-column: 2 / 4; grid-row: 2 / 4; background: rgba(255, 255, 255, 0.08); border: 3px dashed rgba(255, 235, 59, 0.5); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px; gap: 6px; }
    .board-center h2 { font-size: 1.1rem; color: #ffeb3b; }
    .board-center .stats { font-size: 0.75rem; color: #ffd54f; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 10px; }

    .board-tile { background: #ffffff; color: #333; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; border: 3px solid #ffd700; cursor: pointer; transition: 0.2s; overflow: hidden; }
    .board-tile:active { transform: scale(0.95); }
    .board-tile.empty { background: rgba(255, 255, 255, 0.12); border: 2px dashed rgba(255, 255, 255, 0.3); color: #aaa; justify-content: center; align-items: center; text-align: center; }
    .board-tile.current-pos { border: 3px solid #ff5252; box-shadow: 0 0 15px #ff5252; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    
    .tile-header { display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: bold; }
    .tile-owner { padding: 1px 5px; border-radius: 6px; color: #fff; font-size: 0.6rem; }
    .tile-body { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
    .tile-body video { width: 100%; height: 45px; object-fit: cover; border-radius: 6px; margin-top: 2px; }
    .tile-footer { font-size: 0.65rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; color: #555; }

    .action-bar { background: rgba(0, 0, 0, 0.3); padding: 12px 16px; display: flex; align-items: center; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    button#recordBtn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ffeb3b, #ff9800); color: #3a1c71; border: none; border-radius: 20px; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
    button#recordBtn:disabled { background: #888; color: #ccc; cursor: not-allowed; }

    #modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #fffdf9; color: #4a4a4a; width: 100%; max-width: 320px; border-radius: 24px; border: 4px solid #ff9800; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content h3 { color: #ff9800; font-size: 1.15rem; text-align: center; }
    .modal-video-preview { width: 100%; height: 140px; border-radius: 12px; object-fit: cover; background: #000; }
    .modal-content textarea { width: 100%; height: 60px; border: 2px solid #ffe0b2; border-radius: 12px; padding: 8px; font-size: 0.9rem; resize: none; outline: none; background: #fff8e1; }
    .sticker-picker { display: flex; justify-content: space-around; font-size: 1.4rem; cursor: pointer; }
    .modal-btn { background: #ff9800; color: white; border: none; padding: 10px; border-radius: 14px; font-size: 1rem; font-weight: bold; cursor: pointer; }

    #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-50px); background: #ffeb3b; color: #3a1c71; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: bold; z-index: 3000; transition: 0.3s; opacity: 0; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div id="toast">알림</div>

<div class="app-container">
  <header>
    <div class="logo-area">🎲 부루마블 랜드</div>
    <select id="userPicker" class="user-select">
      <option value="채원" data-color="#ff6b8b">🎀 채원</option>
      <option value="민서" data-color="#2b8a3e">🌱 민서</option>
      <option value="도윤" data-color="#1864ab">⭐ 도윤</option>
    </select>
  </header>

  <div class="board-container" id="boardGrid"></div>

  <div class="action-bar">
    <button id="recordBtn">🎲 주사위 던지고 2초 점령하기!</button>
  </div>
</div>

<div id="modalOverlay">
  <div class="modal-content" id="modalContentBody"></div>
</div>

<!-- Firebase v9 SDK (ES Modules 방식) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js";

  // 전달해주신 마스터 열쇠 적용!
  const firebaseConfig = {
    apiKey: "AIzaSyBvB51VnKXUnKqdoLvNxFBPJruG9FUzjTU",
    authDomain: "mapc-646a1.firebaseapp.com",
    projectId: "mapc-646a1",
    storageBucket: "mapc-646a1.firebasestorage.app",
    messagingSenderId: "241239587123",
    appId: "1:241239587123:web:19ba192b03dae4ea06e646",
    measurementId: "G-M6HCB2B8HK"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let boardTiles = Array(12).fill(null);
  let selectedTileIndex = 0;
  let currentVideoBlob = null;
  let selectedEmoji = '🏰';

  const userColors = { '채원': '#ff6b8b', '민서': '#2b8a3e', '도윤': '#1864ab' };
  const boardGrid = document.getElementById('boardGrid');
  const recordBtn = document.getElementById('recordBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalContentBody = document.getElementById('modalContentBody');
  const userPicker = document.getElementById('userPicker');
  const toast = document.getElementById('toast');

  const gridPositions = [
    {r: 1, c: 1}, {r: 1, c: 2}, {r: 1, c: 3}, {r: 1, c: 4},
    {r: 2, c: 4}, {r: 3, c: 4}, {r: 4, c: 4}, {r: 4, c: 3},
    {r: 4, c: 2}, {r: 4, c: 1}, {r: 3, c: 1}, {r: 2, c: 1}
  ];

  // 1. 실시간 데이터베이스 구독 (누군가 땅을 점령하면 내 화면도 0.1초만에 갱신됨)
  const q = query(collection(db, "spots"), orderBy("timestamp", "asc"));
  onSnapshot(q, (snapshot) => {
    boardTiles = Array(12).fill(null); // 배열 초기화
    snapshot.forEach((doc) => {
      const data = doc.data();
      boardTiles[data.tileIdx] = data; // 최신 점령자 데이터로 덮어쓰기
    });
    renderBoard();
  });

  function renderBoard() {
    boardGrid.innerHTML = '';
    const occupiedCount = boardTiles.filter(t => t !== null).length;
    const centerDiv = document.createElement('div');
    centerDiv.className = 'board-center';
    centerDiv.innerHTML = `
      <h2>🎲 부루마블 랜드</h2>
      <div class="stats">점령된 영토: ${occupiedCount} / 12칸</div>
      <p>내 말 위치: <b>#${selectedTileIndex+1}번 칸</b></p>
    `;
    boardGrid.appendChild(centerDiv);

    gridPositions.forEach((pos, index) => {
      const tileData = boardTiles[index];
      const tile = document.createElement('div');
      tile.style.gridRow = pos.r;
      tile.style.gridColumn = pos.c;

      let tileClass = 'board-tile';
      if (index === selectedTileIndex) tileClass += ' current-pos';

      if (!tileData) {
        tile.className = `${tileClass} empty`;
        tile.innerHTML = `<span>#${index+1}<br>빈땅</span>`;
      } else {
        tile.className = tileClass;
        tile.style.borderColor = userColors[tileData.user] || '#ffd700';
        tile.innerHTML = `
          <div class="tile-header">
            <span>${tileData.sticker} #${index+1}</span>
            <span class="tile-owner" style="background:${userColors[tileData.user]||'#333'}">${tileData.user}</span>
          </div>
          <div class="tile-body">
            <video src="${tileData.videoUrl}" autoplay loop muted playsinline></video>
          </div>
          <div class="tile-footer">${tileData.text}</div>
        `;
      }

      tile.addEventListener('click', () => {
        if (tileData) openViewModal(index, tileData);
        else showToast(`✨ #${index+1}번 빈 땅입니다! 주사위를 던져 이동하세요.`);
      });

      boardGrid.appendChild(tile);
    });
  }

  // 2. 주사위 던지고 2초 녹화
  recordBtn.addEventListener('click', async () => {
    recordBtn.disabled = true;
    const diceRoll = Math.floor(Math.random() * 3) + 1;
    selectedTileIndex = (selectedTileIndex + diceRoll) % 12;
    renderBoard();
    showToast(`🎲 주사위 [${diceRoll}]! #${selectedTileIndex+1}번 칸으로 이동!`);

    try {
      recordBtn.innerText = "📸 카메라 준비 중...";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
      
      recordBtn.innerText = "✨ 2초 순간 기록 중!";
      const mediaRecorder = new MediaRecorder(stream);
      const chunks = [];
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(track => track.stop());
        currentVideoBlob = new Blob(chunks, { type: 'video/mp4' });
        
        openRecordModal(selectedTileIndex, URL.createObjectURL(currentVideoBlob));
        recordBtn.innerText = "🎲 주사위 던지고 2초 점령하기!";
      };

      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), 2000);
    } catch(e) {
      alert("카메라 권한을 허용해주세요!");
      recordBtn.disabled = false;
      recordBtn.innerText = "🎲 주사위 던지고 2초 점령하기!";
    }
  });

  function openRecordModal(tileIdx, localUrl) {
    const existing = boardTiles[tileIdx];
    const actionText = existing ? `🔥 [${existing.user}] 땅 뺏고 점령하기!` : `🏰 새로운 랜드마크 등록!`;

    window.setEmoji = (emoji) => { selectedEmoji = emoji; }; // 전역 스코프 연결

    modalContentBody.innerHTML = `
      <h3>🎲 #${tileIdx+1}번 칸 점령!</h3>
      <video class="modal-video-preview" src="${localUrl}" autoplay loop muted playsinline></video>
      <div class="sticker-picker">
        <span onclick="setEmoji('🏰')">🏰</span>
        <span onclick="setEmoji('⭐')">⭐</span>
        <span onclick="setEmoji('🔥')">🔥</span>
        <span onclick="setEmoji('🍔')">🍔</span>
      </div>
      <textarea id="tileDiaryText" placeholder="이 칸에 남길 소감을 적어보세요!"></textarea>
      <button class="modal-btn" id="saveDataBtn">${actionText}</button>
    `;
    modalOverlay.style.display = 'flex';

    document.getElementById('saveDataBtn').addEventListener('click', () => saveToFirebase(tileIdx));
  }

  // 3. Firebase 서버에 저장 (스토리지 + 파이어스토어)
  async function saveToFirebase(tileIdx) {
    const text = document.getElementById('tileDiaryText').value.trim() || "부루마블 정복 완료! 🎲";
    const currentUser = userPicker.value;
    
    document.getElementById('saveDataBtn').innerText = "☁️ 서버에 깃발 꽂는 중...";
    document.getElementById('saveDataBtn').disabled = true;

    try {
      // (1) 비디오를 Storage에 업로드
      const fileName = `videos/tile_${Date.now()}.mp4`;
      const storageRef = ref(storage, fileName);
      await uploadBytes(storageRef, currentVideoBlob);
      const downloadUrl = await getDownloadURL(storageRef);

      // (2) 텍스트와 영상 주소를 Firestore에 저장
      await addDoc(collection(db, "spots"), {
        tileIdx: tileIdx,
        user: currentUser,
        videoUrl: downloadUrl,
        text: text,
        sticker: selectedEmoji,
        timestamp: Date.now()
      });

      modalOverlay.style.display = 'none';
      recordBtn.disabled = false;
      showToast(`✨ #${tileIdx+1}번 칸 완벽하게 점령 완료!`);
    } catch(err) {
      console.error(err);
      alert("업로드 중 오류 발생! (Storage 규칙을 확인하셨나요?)");
      recordBtn.disabled = false;
    }
  }

  function openViewModal(tileIdx, data) {
    modalContentBody.innerHTML = `
      <h3>${data.sticker} #${tileIdx+1}번 랜드마크</h3>
      <div style="font-size:0.8rem; color:#ff9800; text-align:center; font-weight:bold;">소유주: ${data.user}</div>
      <video class="modal-video-preview" src="${data.videoUrl}" autoplay loop muted playsinline></video>
      <div style="background:#fff8e1; padding:10px; border-radius:10px; text-align:center; font-size:0.9rem; border:1px dashed #ff9800;">${data.text}</div>
      <button class="modal-btn" id="closeModalBtn">닫기</button>
    `;
    modalOverlay.style.display = 'flex';
    document.getElementById('closeModalBtn').addEventListener('click', () => { modalOverlay.style.display = 'none'; });
  }

  function showToast(msg) {
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 3000);
  }

  // 초기 렌더링
  renderBoard();
</script>
</body>
</html>
