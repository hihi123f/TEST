<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리들의 부루마블 랜드 🎲👑</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Jua', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; background: #2b1055; color: #fff; overflow: hidden; position: fixed; }

    .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; background: radial-gradient(circle, #3a1c71 0%, #1d093b 100%); }

    /* 상단 헤더 */
    header { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.15); z-index: 1000; }
    .logo-area { display: flex; align-items: center; gap: 6px; font-size: 1.1rem; color: #ffeb3b; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .user-select { background: #fff; color: #3a1c71; border: none; padding: 6px 12px; border-radius: 14px; font-size: 0.85rem; font-weight: bold; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    /* 부루마블 보드판 메인 영역 */
    .board-container { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; position: relative; z-index: 1; }

    /* 중앙 센터 (썰렁함 없애고 꽉 채운 대시보드 형태) */
    .board-center { grid-column: 2 / 4; grid-row: 2 / 4; background: rgba(255, 255, 255, 0.08); border: 3px dashed rgba(255, 235, 59, 0.5); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px; box-shadow: inset 0 4px 20px rgba(0,0,0,0.5); gap: 6px; }
    .board-center h2 { font-size: 1.1rem; color: #ffeb3b; }
    .board-center .stats { font-size: 0.75rem; color: #ffd54f; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 10px; }
    .board-center p { font-size: 0.7rem; color: #ccc; line-height: 1.2; }

    /* 보드게임 칸 스타일 */
    .board-tile { background: #ffffff; color: #333; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; position: relative; border: 3px solid #ffd700; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; transition: 0.2s; overflow: hidden; }
    .board-tile:active { transform: scale(0.95); }
    .board-tile.empty { background: rgba(255, 255, 255, 0.12); border: 2px dashed rgba(255, 255, 255, 0.3); color: #aaa; justify-content: center; align-items: center; font-size: 0.7rem; text-align: center; }
    .board-tile.current-pos { border: 3px solid #ff5252; box-shadow: 0 0 15px #ff5252; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    
    .tile-header { display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: bold; }
    .tile-owner { padding: 1px 5px; border-radius: 6px; color: #fff; font-size: 0.6rem; }
    .tile-body { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
    .tile-body video { width: 100%; height: 45px; object-fit: cover; border-radius: 6px; margin-top: 2px; }
    .tile-footer { font-size: 0.65rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; color: #555; }

    /* 하단 촬영 바 */
    .action-bar { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); padding: 12px 16px; display: flex; gap: 10px; align-items: center; border-top: 2px solid rgba(255,255,255,0.1); z-index: 1000; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    button#recordBtn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ffeb3b, #ff9800); color: #3a1c71; border: none; border-radius: 20px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 235, 59, 0.4); }
    button#recordBtn:active { transform: scale(0.97); }

    /* 다이어리 팝업 모달 */
    #modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #fffdf9; color: #4a4a4a; width: 100%; max-width: 320px; border-radius: 24px; border: 4px solid #ff9800; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-content h3 { color: #ff9800; font-size: 1.15rem; text-align: center; }
    .modal-video-preview { width: 100%; height: 140px; border-radius: 12px; object-fit: cover; background: #000; border: 2px solid #ffe0b2; }
    .modal-content textarea { width: 100%; height: 60px; border: 2px solid #ffe0b2; border-radius: 12px; padding: 8px; font-size: 0.9rem; resize: none; outline: none; background: #fff8e1; }
    .sticker-picker { display: flex; justify-content: space-around; font-size: 1.4rem; cursor: pointer; }
    .modal-btn { background: #ff9800; color: white; border: none; padding: 10px; border-radius: 14px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3); }

    /* 토스트 메시지 */
    #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-50px); background: #ffeb3b; color: #3a1c71; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: bold; box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 3000; transition: 0.3s; opacity: 0; pointer-events: none; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div id="toast">🎲 주사위 굴리는 중!</div>

<div class="app-container">
  <header>
    <div class="logo-area">
      <span>🎲 부루마블 랜드</span>
    </div>
    <select id="userPicker" class="user-select">
      <option value="채원" data-color="#ff6b8b">🎀 채원 (나)</option>
      <option value="민서" data-color="#2b8a3e">🌱 민서</option>
      <option value="도윤" data-color="#1864ab">⭐ 도윤</option>
    </select>
  </header>

  <!-- 부루마블 보드판 -->
  <div class="board-container" id="boardGrid"></div>

  <!-- 하단 촬영 바 (카메라 미리보기 제거하고 깔끔한 통짜 버튼) -->
  <div class="action-bar">
    <button id="recordBtn">🎲 주사위 던지고 2초 점령하기!</button>
  </div>
</div>

<div id="modalOverlay">
  <div class="modal-content" id="modalContentBody"></div>
</div>

<script>
  let boardTiles = Array(12).fill(null);
  let selectedTileIndex = 0; // 내 말의 위치
  let currentVideoUrl = null;
  let selectedEmoji = '🏰';

  const userColors = { '채원': '#ff6b8b', '민서': '#2b8a3e', '도윤': '#1864ab' };
  const boardGrid = document.getElementById('boardGrid');
  const recordBtn = document.getElementById('recordBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalContentBody = document.getElementById('modalContentBody');
  const userPicker = document.getElementById('userPicker');
  const toast = document.getElementById('toast');

  const gridPositions = [
    {r: 1, c: 1}, {r: 1, c: 2}, {r: 1, c: 3}, {r: 1, c: 4},
    {r: 2, c: 4}, {r: 3, c: 4}, {r: 4, c: 4}, {r: 4, c: 3},
    {r: 4, c: 2}, {r: 4, c: 1}, {r: 3, c: 1}, {r: 2, c: 1}
  ];

  function initBoard() {
    boardGrid.innerHTML = '';
    
    // 채워진 센터 대시보드
    const occupiedCount = boardTiles.filter(t => t !== null).length;
    const centerDiv = document.createElement('div');
    centerDiv.className = 'board-center';
    centerDiv.innerHTML = `
      <h2>🎲 부루마블 랜드</h2>
      <div class="stats">점령된 영토: ${occupiedCount} / 12칸</div>
      <p>내 말 위치: <b>#${selectedTileIndex+1}번 칸</b></p>
    `;
    boardGrid.appendChild(centerDiv);

    // 12칸 보드 렌더링
    gridPositions.forEach((pos, index) => {
      const tileData = boardTiles[index];
      const tile = document.createElement('div');
      tile.style.gridRow = pos.r;
      tile.style.gridColumn = pos.c;

      let tileClass = 'board-tile';
      if (index === selectedTileIndex) tileClass += ' current-pos'; // 내 말 위치 하이라이트

      if (!tileData) {
        tile.className = `${tileClass} empty`;
        tile.innerHTML = `<span>#${index+1}<br>빈땅</span>`;
      } else {
        tile.className = tileClass;
        tile.style.borderColor = userColors[tileData.user];
        tile.innerHTML = `
          <div class="tile-header">
            <span>${tileData.sticker} #${index+1}</span>
            <span class="tile-owner" style="background:${userColors[tileData.user]}">${tileData.user}</span>
          </div>
          <div class="tile-body">
            <video src="${tileData.videoUrl}" muted playsinline></video>
          </div>
          <div class="tile-footer">${tileData.text}</div>
        `;
      }

      tile.addEventListener('click', () => {
        if (tileData) openViewModal(index, tileData);
        else showToast(`✨ #${index+1}번 빈 땅입니다! 주사위를 던져 이동하세요.`);
      });

      boardGrid.appendChild(tile);
    });
  }

  // 🎲 주사위 던지기 & 점령 버튼 (클릭 순간에만 카메라 활성화)
  recordBtn.addEventListener('click', async () => {
    recordBtn.disabled = true;
    recordBtn.innerText = "🎲 주사위 굴리는 중...";

    // 1~3칸 이동
    const diceRoll = Math.floor(Math.random() * 3) + 1;
    selectedTileIndex = (selectedTileIndex + diceRoll) % 12;
    initBoard();

    showToast(`🎲 주사위 눈 [${diceRoll}]! #${selectedTileIndex+1}번 칸으로 이동!`);

    try {
      // 💡 핵심 개선: 녹화할 때만 카메라를 켜서 불필요한 배터리 소모 및 인디케이터(초록불) 방지
      recordBtn.innerText = "📸 카메라 켜는 중...";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
      
      recordBtn.innerText = "✨ 2초 순간 기록 중!";
      const mediaRecorder = new MediaRecorder(stream);
      const chunks = [];
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      
      mediaRecorder.onstop = () => {
        // 녹화 끝나자마자 카메라 하드웨어 즉시 종료 (초록불 꺼짐)
        stream.getTracks().forEach(track => track.stop());

        currentVideoUrl = URL.createObjectURL(new Blob(chunks, { type: 'video/mp4' }));
        openRecordModal(selectedTileIndex);
        
        recordBtn.disabled = false;
        recordBtn.innerText = "🎲 주사위 던지고 2초 점령하기!";
      };

      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), 2000); // 정확히 2초

    } catch(e) {
      alert("카메라 및 마이크 권한을 허용해야 랜드마크를 점령할 수 있어요!");
      recordBtn.disabled = false;
      recordBtn.innerText = "🎲 주사위 던지고 2초 점령하기!";
    }
  });

  function openRecordModal(tileIdx) {
    const existing = boardTiles[tileIdx];
    const actionText = existing ? `🔥 [${existing.user}] 땅 뺏고 점령하기!` : `🏰 새로운 랜드마크 등록!`;

    modalContentBody.innerHTML = `
      <h3>🎲 #${tileIdx+1}번 칸 점령!</h3>
      <video class="modal-video-preview" src="${currentVideoUrl}" autoplay loop muted playsinline></video>
      <div class="sticker-picker">
        <span onclick="setEmoji('🏰')">🏰</span>
        <span onclick="setEmoji('⭐')">⭐</span>
        <span onclick="setEmoji('🔥')">🔥</span>
        <span onclick="setEmoji('☕')">☕</span>
        <span onclick="setEmoji('🍔')">🍔</span>
      </div>
      <textarea id="tileDiaryText" placeholder="이 칸에 남길 한 줄 소감을 적어보세요!"></textarea>
      <button class="modal-btn" onclick="saveTileData(${tileIdx})">${actionText}</button>
    `;
    modalOverlay.style.display = 'flex';
  }

  function setEmoji(emoji) { selectedEmoji = emoji; }

  function saveTileData(tileIdx) {
    const text = document.getElementById('tileDiaryText').value.trim() || "부루마블 정복 완료! 🎲";
    const currentUser = userPicker.value;
    const prevOwner = boardTiles[tileIdx] ? boardTiles[tileIdx].user : null;

    boardTiles[tileIdx] = { user: currentUser, videoUrl: currentVideoUrl, text, sticker: selectedEmoji };
    modalOverlay.style.display = 'none';
    initBoard();

    if (prevOwner && prevOwner !== currentUser) {
      showToast(`🚩 [${currentUser}]님이 [${prevOwner}]님의 영토를 빼앗았습니다!`);
    } else {
      showToast(`✨ #${tileIdx+1}번 칸 영토 획득 성공!`);
    }
  }

  function openViewModal(tileIdx, data) {
    modalContentBody.innerHTML = `
      <h3>${data.sticker} #${tileIdx+1}번 랜드마크</h3>
      <div style="font-size:0.8rem; color:#ff9800; text-align:center; font-weight:bold;">소유주: ${data.user}</div>
      <video class="modal-video-preview" src="${data.videoUrl}" autoplay loop muted playsinline></video>
      <div style="background:#fff8e1; padding:10px; border-radius:10px; text-align:center; font-size:0.9rem; border:1px dashed #ff9800;">${data.text}</div>
      <button class="modal-btn" onclick="closeModal()">닫기</button>
    `;
    modalOverlay.style.display = 'flex';
  }

  function closeModal() { modalOverlay.style.display = 'none'; }

  function showToast(msg) {
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 3000);
  }

  initBoard();
</script>
</body>
</html>
